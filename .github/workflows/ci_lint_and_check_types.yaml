name: Lint & Check Types

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Dependencies
        uses: ./.github/actions/setup

      - name: 🧹 Run Lint
        run: pnpm lint

      - name: 🔍 Run Check Types
        run: pnpm check-types

      - name: ✨ Done!
        run: echo "Code quality checks complete."